<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hungerford RFC Juniors Signature</title>
  <!-- Google Fonts embed for modern/web email clients -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;700&display=swap" rel="stylesheet">
</head>
<body style="margin: 0; padding: 0;">
  <!-- Main Stacked Container -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse: collapse; font-family: 'Poppins', Arial, Helvetica, sans-serif; width: 100%; max-width: 520px;">
    
    <!-- 1 & 2. NAME & ROLE -->
    <tr>
      <td style="padding-bottom: 14px;">
        <span style="font-family: 'Poppins', Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; color: #821c34; line-height: 24px; display: block;">
          Matt Allard
        </span>
        <span style="font-family: 'Poppins', Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 300; color: #821c34; line-height: 24px; display: block; margin-top: 2px;">
          Secretary, Hungerford RFC Juniors
        </span>
      </td>
    </tr>

    <!-- 3. CREST COMBO -->
    <tr>
      <td style="padding-bottom: 16px;">
        <img src="https://cdn.jsdelivr.net/gh/neon-mda/HRFCAssets@main/HRFCJRWARRIORS.png" 
             alt="Hungerford RFC Juniors & Warriors" 
             width="460" 
             style="display: block; width: 460px; max-width: 100%; height: auto; border: 0; -ms-interpolation-mode: bicubic;" />
      </td>
    </tr>

    <!-- 4. TREDS DEVICE -->
    <tr>
      <td>
        <img src="https://cdn.jsdelivr.net/gh/neon-mda/HRFCAssets@main/TREDS.png" 
             alt="RFU Core Values - Teamwork, Respect, Enjoyment, Discipline, Sportspersonship" 
             width="520" 
             style="display: block; width: 520px; max-width: 100%; height: auto; border: 0; -ms-interpolation-mode: bicubic;" />
      </td>
    </tr>

  </table>
</body>
</html>
